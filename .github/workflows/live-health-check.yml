# External safety net for Live (GL-15, cibus-issues 286, owner decision 2026-09-06).
#
# The self-hosted uptime probe lives INSIDE Supabase (pg_cron on each tier), so it can
# never report that Supabase itself is down. This workflow is the one check that lives
# outside: every 10 minutes it GETs Live's /health edge function from GitHub's runners.
# It runs in this PUBLIC repo because Actions minutes are free here.
#
# DOWN = three attempts 20 s apart all fail (non-200, or ok!=true, or tier!=live).
# On DOWN it opens ONE sticky issue "Live /health is DOWN (external check)" — labelled
# owner:abbas + alert (the alert label keeps it off Cibus-6-0's regression scoreboard,
# docs/testing/README.md §3 there: it closes itself, so there is never a fix to pin) — or comments
# on it if already open — and fails the run, so GitHub also emails the workflow-failure
# notification. On the next healthy run it closes the sticky issue with a recovery note.
#
# Manual RED proof: Actions → this workflow → Run workflow → url = any URL that is not
# Live's /health (e.g. https://httpstat.us/503). The following scheduled run recovers it.
name: Live health check (external)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Override the probed URL (only for a deliberate RED proof)"
        required: false
        default: ""

permissions:
  issues: write
  contents: read

concurrency:
  group: live-health-check
  cancel-in-progress: false

env:
  LIVE_HEALTH_URL: https://iejmitonpgmchfpzvqtm.supabase.co/functions/v1/health
  STICKY_TITLE: "Live /health is DOWN (external check)"
  GH_TOKEN: ${{ github.token }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Probe Live /health (3 attempts, 20 s apart)
        id: probe
        run: |
          url="${{ github.event.inputs.url }}"
          [ -n "$url" ] || url="$LIVE_HEALTH_URL"
          echo "probing $url"
          ok=0; code=000; json=""
          for attempt in 1 2 3; do
            raw=$(curl -sS -m 15 -w '\n%{http_code}' "$url" 2>&1) || true
            code=${raw##*$'\n'}; json=${raw%$'\n'*}
            if [ "$code" = "200" ] && printf '%s' "$json" | grep -q '"ok":true' && printf '%s' "$json" | grep -q '"tier":"live"'; then
              ok=1; echo "attempt $attempt: UP — $json"; break
            fi
            echo "attempt $attempt: DOWN — HTTP $code ${json:0:300}"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          detail="HTTP $code ${json:0:300}"
          detail=${detail//$'\n'/ }
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: DOWN — open or update the sticky issue, then fail the run
        if: steps.probe.outputs.ok == '0'
        env:
          URL: ${{ steps.probe.outputs.url }}
          DETAIL: ${{ steps.probe.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export WHEN=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # The list API is consistent; the search API is not (index lag), so never use --search here.
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title | jq -r --arg t "$STICKY_TITLE" '[.[]|select(.title==$t)][0].number // empty')
          if [ -z "$n" ]; then
            python3 - <<'PY'
          import os
          t = open('.github/live-health-down-body.md').read()
          for k in ('WHEN', 'URL', 'DETAIL', 'RUN_URL'):
              t = t.replace('{{' + k + '}}', os.environ[k])
          open('/tmp/body.md', 'w').write(t)
          PY
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$STICKY_TITLE" --label "owner:abbas,alert" --body-file /tmp/body.md
          else
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Still DOWN at ${WHEN} — \`${DETAIL}\` (run ${RUN_URL})"
          fi
          echo "::error::Live /health is DOWN — ${DETAIL}"
          exit 1

      - name: UP — close the sticky issue if one is open
        if: steps.probe.outputs.ok == '1'
        env:
          DETAIL: ${{ steps.probe.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title | jq -r --arg t "$STICKY_TITLE" '[.[]|select(.title==$t)][0].number // empty')
          if [ -n "$n" ]; then
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Recovered at $(date -u +%Y-%m-%dT%H:%M:%SZ) — \`${DETAIL}\` (run ${RUN_URL})"
            echo "closed sticky issue #$n"
          else
            echo "healthy, nothing open"
          fi
